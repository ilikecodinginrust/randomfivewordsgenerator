<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>words</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <p class="prompt">five words</p>

    <h1 id="word" aria-live="polite" tabindex="0" title="Click for another five"></h1>

    <div class="actions">
      <button id="copy" class="copy" type="button">
        <span class="label">copy</span>
        <span class="check" aria-hidden="true">copied</span>
      </button>
      <button id="next" class="next" type="button">another</button>
    </div>
  </main>

  <script src="words.js"></script>
  <script src="app.js"></script>
</body>
</html>
